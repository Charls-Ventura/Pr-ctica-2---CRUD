<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comprar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Tienda</span>

        <div class="d-flex gap-3 align-items-center">

            <a class="nav-link" href="/">Comprar</a>

            <a class="nav-link" href="/cart">
                Carrito (<span th:text="${cartCount}">0</span>)
            </a>

            <!-- Si NO hay sesión -->
            <a th:if="${user == null}"
               class="btn btn-primary btn-sm"
               href="/login">
                Login Admin
            </a>

            <!-- Si hay sesión ADMIN -->
            <a th:if="${isAdmin}"
               class="btn btn-outline-success btn-sm"
               href="/admin">
                Panel Admin
            </a>

            <!-- Si hay cualquier sesión -->
            <a th:if="${user != null}"
               class="btn btn-outline-danger btn-sm"
               href="/logout">
                Logout
            </a>

        </div>
    </div>
</nav>

<div th:if="${success}" class="alert alert-success mt-3">
    <strong>¡Éxito!</strong>
    <span th:text="${success}"></span>
</div>

<div class="container py-4">
    <h3 class="mb-3">Productos</h3>

    <div class="row g-3">
        <div class="col-md-4" th:each="p : ${productos}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.nombre}">Nombre</h5>
                    <p class="card-text">
                        Precio: <strong th:text="${p.precio}">0</strong>
                    </p>

                    <form method="post" action="/cart/add" class="d-flex gap-2">
                        <input type="hidden" name="productoId" th:value="${p.id}">
                        <input type="number" name="cantidad" class="form-control" value="1" min="1" style="max-width:110px;">
                        <button class="btn btn-primary" type="submit">Agregar</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
