<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Tienda</span>

    <div class="d-flex gap-3 align-items-center">

      <a class="nav-link" href="/">Comprar</a>

      <a class="nav-link" href="/cart">
        Carrito (<span th:text="${cartCount}">0</span>)
      </a>

      <!-- Si NO hay sesión -->
      <a th:if="${user == null}"
         class="btn btn-primary btn-sm"
         href="/login">
        Login Admin
      </a>

      <!-- Si hay sesión ADMIN -->
      <a th:if="${isAdmin}"
         class="btn btn-outline-success btn-sm"
         href="/admin">
        Panel Admin
      </a>

      <!-- Si hay cualquier sesión -->
      <a th:if="${user != null}"
         class="btn btn-outline-danger btn-sm"
         href="/logout">
        Logout
      </a>

    </div>
  </div>
</nav>


<div class="container py-4">
  <h3 class="mb-3">Panel administrador</h3>

  <div class="alert alert-info">
    Bienvenido administrador.
  </div>

  <div class="d-flex gap-2">
    <a class="btn btn-primary" href="/admin/productos">CRUD Productos</a>
    <a class="btn btn-outline-primary" href="/admin/ventas">Ventas</a>
  </div>
</div>

</body>
</html>
