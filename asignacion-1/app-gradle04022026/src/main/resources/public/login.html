<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .login-box {
            width: 320px;
            margin: 120px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 6px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0d6efd;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Formulario de Acceso</h2>
    <form action="/procesarLogin" method="post">
        Usuario: <input type="text" name="usuario" required/><br>
        Password: <input type="password" name="password" required/><br/>
        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
