<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
  <div class="container">
    <a class="navbar-brand" href="/">Carrito</a>
    <div class="d-flex gap-3">
      <a class="nav-link" href="/">Comprar</a>
      <a class="nav-link" href="/cart">
        Carrito (<span th:text="${cartCount}">0</span>)
      </a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h3 class="mb-3">Carrito</h3>

  <div th:if="${#lists.isEmpty(cart)}" class="alert alert-warning">
    Tu carrito está vacío.
  </div>

  <div th:if="${!#lists.isEmpty(cart)}">
    <table class="table table-bordered align-middle">
      <thead>
      <tr>
        <th>Producto</th>
        <th style="width:120px;">Precio</th>
        <th style="width:120px;">Cantidad</th>
        <th style="width:120px;">Subtotal</th>
        <th style="width:220px;">Acción</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="i : ${cart}">
        <td th:text="${i.nombre}">Nombre</td>
        <td th:text="${i.precio}">0</td>
        <td th:text="${i.cantidad}">1</td>
        <td th:text="${i.subtotal}">0</td>
        <td>

          <!-- ✅ QUITAR POR CANTIDAD -->
          <form method="post" action="/cart/decrease" class="d-flex gap-2 align-items-center">
            <input type="hidden" name="productoId" th:value="${i.productoId}">

            <input type="number"
                   name="cantidad"
                   class="form-control form-control-sm"
                   value="1"
                   min="1"
                   th:attr="max=${i.cantidad}"
                   style="width:80px;">

            <button class="btn btn-danger btn-sm" type="submit">Quitar</button>
          </form>

        </td>
      </tr>
      </tbody>
    </table>

    <h5>Total: <span th:text="${total}">0</span></h5>

    <hr>

    <h5>Procesar compra</h5>
    <form method="post" action="/cart/checkout" class="d-flex gap-2">
      <input type="text" class="form-control" name="nombreCliente" placeholder="Nombre del cliente" required>
      <button class="btn btn-success" type="submit">Comprar</button>
    </form>
  </div>
</div>

</body>
</html>
