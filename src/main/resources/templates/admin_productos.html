<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUD Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Tienda</span>


    <div class="d-flex gap-3 align-items-center">

      <a class="nav-link" href="/">Comprar</a>

      <a class="nav-link" href="/cart">
        Carrito (<span th:text="${cartCount}">0</span>)
      </a>

      <!-- Si NO hay sesión -->
      <a th:if="${user == null}"
         class="btn btn-primary btn-sm"
         href="/login">
        Login Admin
      </a>

      <!-- Si hay sesión ADMIN -->
      <a th:if="${isAdmin}"
         class="btn btn-outline-success btn-sm"
         href="/admin">
        Panel Admin
      </a>

      <!-- Si hay cualquier sesión -->
      <a th:if="${user != null}"
         class="btn btn-outline-danger btn-sm"
         href="/logout">
        Logout
      </a>

    </div>
  </div>
</nav>


<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="m-0">CRUD Productos</h3>
    <a class="btn btn-success" href="/admin/productos/new">+ Nuevo</a>
  </div>

  <table class="table table-bordered align-middle">
    <thead>
    <tr>
      <th style="width:80px;">ID</th>
      <th>Nombre</th>
      <th style="width:140px;">Precio</th>
      <th style="width:220px;">Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${productos}">
      <td th:text="${p.id}">1</td>
      <td th:text="${p.nombre}">Nombre</td>
      <td th:text="${p.precio}">0</td>
      <td class="d-flex gap-2">
        <a class="btn btn-primary btn-sm"
           th:href="@{'/admin/productos/' + ${p.id} + '/edit'}">Editar</a>

        <form method="post"
              th:action="@{'/admin/productos/' + ${p.id} + '/delete'}"
              onsubmit="return confirm('¿Eliminar este producto?');">
          <button class="btn btn-danger btn-sm" type="submit">Eliminar</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
