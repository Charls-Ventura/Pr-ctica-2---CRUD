<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Tienda</span>

        <div class="d-flex gap-3 align-items-center">

            <a class="nav-link" href="/">Comprar</a>

            <a class="nav-link" href="/cart">
                Carrito (<span th:text="${cartCount}">0</span>)
            </a>

            <!-- Si NO hay sesión -->
            <a th:if="${user == null}"
               class="btn btn-primary btn-sm"
               href="/login">
                Login Admin
            </a>

            <!-- Si hay sesión ADMIN -->
            <a th:if="${isAdmin}"
               class="btn btn-outline-success btn-sm"
               href="/admin">
                Panel Admin
            </a>

            <!-- Si hay cualquier sesión -->
            <a th:if="${user != null}"
               class="btn btn-outline-danger btn-sm"
               href="/logout">
                Logout
            </a>

        </div>
    </div>
</nav>


<div class="container py-4" style="max-width: 520px;">
    <h3 class="mb-3">Login</h3>

    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

    <form method="post" action="/login" class="d-grid gap-3">
        <div>
            <label class="form-label">User</label>
            <input class="form-control" name="username" required>
        </div>

        <div>
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
        </div>

        <!-- Requisito 4: Recordarme -->
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember" id="remember">
            <label class="form-check-label" for="remember">
                Recordarme (7 días)
            </label>
        </div>

        <button class="btn btn-primary" type="submit">Entrar</button>
        <a class="btn btn-outline-secondary" href="/">Volver</a>
    </form>
</div>

</body>
</html>
