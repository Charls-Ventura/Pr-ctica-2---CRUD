<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Tienda</span>

    <div class="d-flex gap-3 align-items-center">

      <a class="nav-link" href="/">Comprar</a>

      <a class="nav-link" href="/cart">
        Carrito (<span th:text="${cartCount}">0</span>)
      </a>

      <!-- Si NO hay sesión -->
      <a th:if="${user == null}"
         class="btn btn-primary btn-sm"
         href="/login">
        Login Admin
      </a>

      <!-- Si hay sesión ADMIN -->
      <a th:if="${isAdmin}"
         class="btn btn-outline-success btn-sm"
         href="/admin">
        Panel Admin
      </a>

      <!-- Si hay cualquier sesión -->
      <a th:if="${user != null}"
         class="btn btn-outline-danger btn-sm"
         href="/logout">
        Logout
      </a>

    </div>
  </div>
</nav>


<div class="container py-4">
  <h3 class="mb-3">Ventas realizadas</h3>

  <div th:if="${#lists.isEmpty(compras)}" class="alert alert-warning">
    No hay compras registradas todavía.
  </div>

  <div th:if="${!#lists.isEmpty(compras)}" class="accordion" id="ventasAcc">
    <div class="accordion-item" th:each="c, st : ${compras}">
      <h2 class="accordion-header" th:id="'h'+${st.index}">
        <button class="accordion-button collapsed" type="button"
                data-bs-toggle="collapse"
                th:attr="data-bs-target='#col'+${st.index}">
          <span class="me-3 fw-bold" th:text="${c.nombreCliente}">Cliente</span>
          <span class="text-muted">Compra #</span><span class="text-muted" th:text="${st.index + 1}">1</span>
        </button>
      </h2>

      <div class="accordion-collapse collapse" th:id="'col'+${st.index}" data-bs-parent="#ventasAcc">
        <div class="accordion-body">

          <table class="table table-bordered align-middle">
            <thead>
            <tr>
              <th>Producto</th>
              <th style="width:120px;">Precio</th>
              <th style="width:120px;">Cantidad</th>
              <th style="width:140px;">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="it : ${c.items}">
              <td th:text="${it.nombre}">Nombre</td>
              <td th:text="${it.precio}">0</td>
              <td th:text="${it.cantidad}">1</td>
              <td th:text="${it.subtotal}">0</td>
            </tr>
            </tbody>
          </table>

          <h6 class="text-end">
            Total: <span th:text="${c.total}">0</span>
          </h6>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
