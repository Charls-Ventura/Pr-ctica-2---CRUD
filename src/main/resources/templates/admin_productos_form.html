<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo}">Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Tienda</span>

    <div class="d-flex gap-3 align-items-center">

      <a class="nav-link" href="/">Comprar</a>

      <a class="nav-link" href="/cart">
        Carrito (<span th:text="${cartCount}">0</span>)
      </a>

      <!-- Si NO hay sesión -->
      <a th:if="${user == null}"
         class="btn btn-primary btn-sm"
         href="/login">
        Login Admin
      </a>

      <!-- Si hay sesión ADMIN -->
      <a th:if="${isAdmin}"
         class="btn btn-outline-success btn-sm"
         href="/admin">
        Panel Admin
      </a>

      <!-- Si hay cualquier sesión -->
      <a th:if="${user != null}"
         class="btn btn-outline-danger btn-sm"
         href="/logout">
        Logout
      </a>

    </div>
  </div>
</nav>


<div class="container py-4" style="max-width: 720px;">
  <h3 class="mb-3" th:text="${titulo}">Formulario</h3>

  <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

  <form method="post" th:action="${action}">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" name="nombre" th:value="${nombre}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Precio</label>
      <input class="form-control" type="number" step="0.01" min="0.01" name="precio" th:value="${precio}" required>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-success" type="submit" th:text="${btn}">Guardar</button>
      <a class="btn btn-secondary" href="/admin/productos">Cancelar</a>
    </div>
  </form>
</div>

</body>
</html>
