<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title th:text="${titulo}">Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4" style="max-width:700px;">

  <h3 th:text="${titulo}">Producto</h3>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form method="post" th:action="${action}" enctype="multipart/form-data">

    <!-- NOMBRE -->
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control"
             type="text"
             name="nombre"
             th:value="${producto != null ? producto.nombre : ''}"
             required>
    </div>

    <!-- PRECIO -->
    <div class="mb-3">
      <label class="form-label">Precio</label>
      <input class="form-control"
             type="number"
             name="precio"
             step="0.01"
             min="0"
             th:value="${producto != null ? producto.precio : ''}"
             required>
      <div class="form-text">No se permiten negativos.</div>
    </div>

    <!-- DESCRIPCION -->
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control"
                name="descripcion"
                rows="4"
                required
                th:text="${producto != null ? producto.descripcion : ''}"></textarea>
    </div>

    <!-- IMAGEN (1 SOLA) -->
    <div class="mb-3">
      <label class="form-label">Imagen (1)</label>
      <input class="form-control"
             type="file"
             name="imagen"
             accept="image/*"
             th:attr="required=${producto == null}">
      <div class="form-text">
        <span th:if="${producto == null}">Obligatoria al crear.</span>
        <span th:if="${producto != null}">Opcional al editar (si no subes, se mantiene la actual).</span>
      </div>
    </div>

    <!-- PREVIEW SI YA EXISTE -->
    <div class="mb-3" th:if="${producto != null && producto.tieneImagen}">
      <label class="form-label">Imagen actual</label>
      <div>
        <img th:src="@{'/producto/' + ${producto.id} + '/img'}"
             alt="imagen producto"
             style="max-width: 220px; max-height: 220px; object-fit: contain;"
             class="border rounded p-2 bg-white">
      </div>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit" th:text="${btn}">Guardar</button>
      <a href="/admin/productos" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>
</div>

</body>
</html>
