<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title th:text="${titulo}">Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4" style="max-width:650px;">
  <h3 th:text="${titulo}">Usuario</h3>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form method="post" th:action="${action}" class="d-grid gap-3">

    <div>
      <label class="form-label">Username</label>
      <input class="form-control" name="username"
             th:value="${usuarioEdit != null ? usuarioEdit.username : ''}"
             required>
    </div>

    <div>
      <label class="form-label">Nombre</label>
      <input class="form-control" name="nombre"
             th:value="${usuarioEdit != null ? usuarioEdit.nombre : ''}"
             required>
    </div>

    <div>
      <label class="form-label">
        Password
        <span class="text-muted" th:if="${usuarioEdit != null}">
          (dejar vacío para no cambiarla)
        </span>
      </label>

      <input class="form-control" type="password" name="password"
             th:attr="required=${usuarioEdit == null}">
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="admin" id="admin"
             th:checked="${usuarioEdit != null && usuarioEdit.admin}">
      <label class="form-check-label" for="admin">
        Es Admin
      </label>
    </div>

    <button class="btn btn-primary" type="submit" th:text="${btn}">Guardar</button>
    <a class="btn btn-secondary" href="/admin/usuarios">Cancelar</a>

  </form>
</div>

</body>
</html>
