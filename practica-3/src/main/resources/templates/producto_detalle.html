<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title th:text="${producto.nombre}">Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">

  <h2 th:text="${producto.nombre}"></h2>

  <p><strong>Precio:</strong>
    <span th:text="${#numbers.formatDecimal(producto.precio,1,'COMMA',2,'POINT')}"></span>
  </p>

  <p th:text="${producto.descripcion}"></p>

  <!-- IMÁGENES -->
  <div class="row g-3">
    <div class="col-md-4" th:each="img : ${producto.imagenes}">
      <img class="img-fluid rounded"
           th:src="'data:' + ${img.mimeType} + ';base64,' + ${img.base64}">
    </div>
  </div>

  <hr>

  <!-- AGREGAR COMENTARIO -->
  <h5>Agregar comentario</h5>
  <form method="post"
        th:action="@{'/producto/' + ${producto.id} + '/comentarios'}"
        class="d-flex gap-2">
    <input type="text" name="texto" class="form-control" required>
    <button class="btn btn-primary">Comentar</button>
  </form>

  <hr>

  <!-- LISTA COMENTARIOS -->
  <h5>Comentarios</h5>

  <div th:if="${#lists.isEmpty(comentarios)}"
       class="alert alert-warning">
    No hay comentarios.
  </div>

  <div th:each="c : ${comentarios}" class="border p-2 mb-2 rounded">

    <div th:text="${c.texto}"></div>

    <small class="text-muted"
           th:text="${c.createdAt}"></small>

    <!-- ELIMINAR SI ADMIN -->
    <form th:if="${isAdmin}"
          method="post"
          th:action="@{'/admin/comentarios/' + ${c.id} + '/delete'}">
      <button class="btn btn-sm btn-danger mt-1">Eliminar</button>
    </form>

  </div>

</div>

</body>
</html>
