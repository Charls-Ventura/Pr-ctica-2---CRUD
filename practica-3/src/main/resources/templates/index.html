<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comprar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Contenedor de imagen estilo “card product” */
        .product-img-wrap{
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid rgba(0,0,0,.08);
        }

        /* Imagen real */
        .product-img{
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        /* Placeholder si no hay imagen */
        .product-img-placeholder{
            width: 100%;
            height: 100%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#777;
            font-size:14px;
            background:#f3f3f3;
        }

        .product-desc{
            color:#555;
            font-size: 0.95rem;
            min-height: 44px; /* para que las cards queden más alineadas */
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Tienda</span>

        <div class="d-flex gap-3 align-items-center">

            <a class="nav-link" href="/">Comprar</a>

            <a class="nav-link" href="/cart">
                Carrito (<span th:text="${cartCount}">0</span>)
            </a>

            <!-- Si NO hay sesión -->
            <a th:if="${user == null}"
               class="btn btn-primary btn-sm"
               href="/login">
                Login Admin
            </a>

            <!-- Si hay sesión ADMIN -->
            <a th:if="${isAdmin}"
               class="btn btn-outline-success btn-sm"
               href="/admin">
                Panel Admin
            </a>

            <!-- Si hay cualquier sesión -->
            <a th:if="${user != null}"
               class="btn btn-outline-danger btn-sm"
               href="/logout">
                Logout
            </a>

        </div>
    </div>
</nav>

<div class="container py-4">

    <div th:if="${success}" class="alert alert-success">
        <strong>¡Éxito!</strong>
        <span th:text="${success}"></span>
    </div>

    <h3 class="mb-3">Productos</h3>

    <div th:if="${#lists.isEmpty(productos)}" class="alert alert-warning">
        No hay productos.
    </div>

    <div class="row g-3" th:if="${!#lists.isEmpty(productos)}">
        <div class="col-md-4" th:each="p : ${productos}">
            <div class="card h-100">
                <div class="card-body">

                    <!-- Imagen -->
                    <div class="product-img-wrap">
                        <img class="product-img"
                             th:if="${p.tieneImagen}"
                             th:src="@{'/producto/' + ${p.id} + '/img'}"
                             alt="imagen producto">

                        <div th:if="${!p.tieneImagen}" class="product-img-placeholder">
                            Sin imagen
                        </div>
                    </div>

                    <!-- Info -->
                    <h5 class="card-title mb-1" th:text="${p.nombre}">Nombre</h5>

                    <div class="mb-2">
                        Precio: <strong th:text="${p.precio}">0</strong>
                    </div>

                    <!-- Descripción -->
                    <p class="product-desc mb-3"
                       th:text="${p.descripcion != null ? p.descripcion : ''}">
                        Descripción
                    </p>

                    <!-- Agregar al carrito -->
                    <form method="post" action="/cart/add" class="d-flex gap-2">
                        <input type="hidden" name="productoId" th:value="${p.id}">
                        <input type="number" name="cantidad" class="form-control" value="1" min="1" style="max-width:110px;">
                        <button class="btn btn-primary" type="submit">Agregar</button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Paginación -->
    <div class="mt-4" th:if="${totalPages != null and totalPages > 1}">
        <nav>
            <ul class="pagination">

                <!-- Anterior -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{'/?page=' + (${currentPage} - 1)}">
                        Anterior
                    </a>
                </li>

                <!-- Números -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{'/?page=' + ${i}}"
                       th:text="${i + 1}">
                        1
                    </a>
                </li>

                <!-- Siguiente -->
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/(page=${currentPage + 1})}">
                        Siguiente
                    </a>
                </li>

            </ul>
        </nav>
    </div>

</div>

</body>
</html>
