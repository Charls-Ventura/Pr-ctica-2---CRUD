<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Usuarios</h3>
    <a class="btn btn-primary" href="/admin/usuarios/new">Nuevo Usuario</a>
  </div>

  <div th:if="${#lists.isEmpty(usuarios)}" class="alert alert-warning">
    No hay usuarios.
  </div>

  <table th:if="${!#lists.isEmpty(usuarios)}" class="table table-bordered align-middle">
    <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Nombre</th>
      <th>Admin</th>
      <th style="width:220px;">Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
      <td th:text="${u.id}">1</td>
      <td th:text="${u.username}">user</td>
      <td th:text="${u.nombre}">Nombre</td>
      <td th:text="${u.admin}">false</td>
      <td class="d-flex gap-2">
        <a class="btn btn-sm btn-warning" th:href="@{'/admin/usuarios/' + ${u.id} + '/edit'}">Editar</a>

        <form method="post" th:action="@{'/admin/usuarios/' + ${u.id} + '/delete'}">
          <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <a class="btn btn-secondary" href="/admin">Volver</a>
</div>

</body>
</html>
