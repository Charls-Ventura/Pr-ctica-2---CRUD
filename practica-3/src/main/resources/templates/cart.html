<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light border-bottom">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Tienda</span>

    <div class="d-flex gap-3 align-items-center">
      <a class="nav-link" href="/">Comprar</a>

      <a class="nav-link" href="/cart">
        Carrito (<span th:text="${cartCount}">0</span>)
      </a>

      <a th:if="${user == null}" class="btn btn-primary btn-sm" href="/login">Login Admin</a>

      <a th:if="${isAdmin}" class="btn btn-outline-success btn-sm" href="/admin">Panel Admin</a>

      <a th:if="${user != null}" class="btn btn-outline-danger btn-sm" href="/logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h3 class="mb-3">Carrito</h3>

  <div th:if="${#lists.isEmpty(cart)}" class="alert alert-warning">
    Tu carrito está vacío.
  </div>

  <div th:if="${!#lists.isEmpty(cart)}">

    <table class="table table-bordered align-middle">
      <thead>
      <tr>
        <th>Producto</th>
        <th style="width:140px;">Precio</th>
        <th style="width:110px;">Cantidad</th>
        <th style="width:140px;">Subtotal</th>
        <th style="width:320px;">Acción</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="i : ${cart}">
        <td th:text="${i.nombre}">Nombre</td>

        <td>
          <span th:text="${#numbers.formatDecimal(i.precio, 1, 'COMMA', 2, 'POINT')}">0.00</span>
        </td>

        <td th:text="${i.cantidad}">1</td>

        <td>
          <span th:text="${#numbers.formatDecimal(i.subtotal, 1, 'COMMA', 2, 'POINT')}">0.00</span>
        </td>

        <td>
          <div class="d-flex flex-wrap gap-2">

            <!-- QUITAR POR CANTIDAD -->
            <form method="post" action="/cart/decrease" class="d-flex gap-2 align-items-center">
              <input type="hidden" name="productoId" th:value="${i.productoId}">

              <input type="number"
                     name="cantidad"
                     class="form-control form-control-sm"
                     value="1"
                     min="1"
                     th:attr="max=${i.cantidad}"
                     style="width:90px;"
                     required>

              <button class="btn btn-warning btn-sm" type="submit">Quitar</button>
            </form>

            <!-- ELIMINAR PRODUCTO COMPLETO -->
            <form method="post" action="/cart/remove">
              <input type="hidden" name="productoId" th:value="${i.productoId}">
              <button class="btn btn-danger btn-sm" type="submit">Eliminar</button>
            </form>

          </div>
        </td>
      </tr>
      </tbody>
    </table>

    <h5>
      Total:
      <span th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">0.00</span>
    </h5>

    <hr>

    <h5>Procesar compra</h5>
    <form method="post" action="/cart/checkout" class="d-flex gap-2">
      <input type="text" class="form-control" name="nombreCliente" placeholder="Nombre del cliente" required>
      <button class="btn btn-success" type="submit">Comprar</button>
    </form>
  </div>
</div>

</body>
</html>
